services:
  db:
    image: postgres:16-alpine
    container_name: coworking-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-coworking}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-coworking_pass}
      POSTGRES_DB: ${DB_NAME:-coworking}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-coworking} -d ${DB_NAME:-coworking}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app-net

  web-service:
    build: ./tariff-service
    container_name: coworking-tariff
    restart: unless-stopped
    environment:
      PORT: 5000
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app-net

  backend:
    build: ./backend
    container_name: coworking-backend
    restart: unless-stopped
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-coworking}
      DB_PASSWORD: ${DB_PASSWORD:-coworking_pass}
      DB_NAME: ${DB_NAME:-coworking}
      TARIFF_SERVICE_URL: http://web-service:5000
    depends_on:
      db:
        condition: service_healthy
      web-service:
        condition: service_healthy
    networks:
      - app-net

  frontend:
    build: ./frontend
    container_name: coworking-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    networks:
      - app-net

volumes:
  db_data:

networks:
  app-net:
    driver: bridge
